<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 420" fill="none">
  <rect width="280" height="420" fill="white"/>
  <!-- Device body -->
  <rect x="30" y="20" width="220" height="380" rx="24" fill="#f5f5f0" stroke="#1B7A3D" stroke-width="4"/>
  <rect x="32" y="22" width="216" height="376" rx="22" fill="url(#bodyGrad)"/>

  <!-- NBE Logo area top -->
  <g transform="translate(90,35)">
    <rect x="0" y="12" width="40" height="30" rx="3" fill="#1B7A3D"/>
    <rect x="8" y="5" width="24" height="10" rx="2" fill="#F5A623"/>
    <rect x="10" y="18" width="4" height="18" rx="1" fill="#F5A623"/>
    <rect x="18" y="18" width="4" height="18" rx="1" fill="#F5A623"/>
    <rect x="26" y="18" width="4" height="18" rx="1" fill="#F5A623"/>
    <circle cx="20" cy="9" r="4" fill="#F5A623"/>
  </g>
  <text x="140" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="700" fill="#1B7A3D" letter-spacing="0.5">NATIONAL BANK OF EGYPT</text>

  <!-- Screen -->
  <rect x="55" y="95" width="170" height="50" rx="6" fill="#2a3a2a" stroke="#444" stroke-width="1.5"/>
  <rect x="60" y="100" width="160" height="40" rx="4" fill="#3a5a3a"/>
  <text x="140" y="126" text-anchor="middle" font-family="monospace" font-size="22" font-weight="700" fill="#88cc88">------</text>

  <!-- Labels OTP and E-Sign -->
  <text x="75" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#333">OTP</text>
  <text x="205" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#333">E-Sign</text>

  <!-- Number pad -->
  <!-- Row 1: 1 2 3 -->
  <circle cx="80" cy="195" r="22" fill="#f0f0e8" stroke="#ccc" stroke-width="1.5"/>
  <text x="80" y="201" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#333">1</text>
  <circle cx="140" cy="195" r="22" fill="#f0f0e8" stroke="#ccc" stroke-width="1.5"/>
  <text x="140" y="201" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#333">2</text>
  <circle cx="200" cy="195" r="22" fill="#f0f0e8" stroke="#ccc" stroke-width="1.5"/>
  <text x="200" y="201" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#333">3</text>

  <!-- Row 2: 4 5 6 -->
  <circle cx="80" cy="248" r="22" fill="#f0f0e8" stroke="#ccc" stroke-width="1.5"/>
  <text x="80" y="254" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#333">4</text>
  <circle cx="140" cy="248" r="22" fill="#f0f0e8" stroke="#ccc" stroke-width="1.5"/>
  <text x="140" y="254" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#333">5</text>
  <circle cx="200" cy="248" r="22" fill="#f0f0e8" stroke="#ccc" stroke-width="1.5"/>
  <text x="200" y="254" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#333">6</text>

  <!-- Row 3: 7 8 9 -->
  <circle cx="80" cy="301" r="22" fill="#f0f0e8" stroke="#ccc" stroke-width="1.5"/>
  <text x="80" y="307" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#333">7</text>
  <circle cx="140" cy="301" r="22" fill="#f0f0e8" stroke="#ccc" stroke-width="1.5"/>
  <text x="140" y="307" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#333">8</text>
  <circle cx="200" cy="301" r="22" fill="#f0f0e8" stroke="#ccc" stroke-width="1.5"/>
  <text x="200" y="307" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#333">9</text>

  <!-- Row 4: X 0 OK -->
  <circle cx="80" cy="354" r="22" fill="#fff0f0" stroke="#e55" stroke-width="1.5"/>
  <text x="80" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="800" fill="#cc3333">✕</text>
  <circle cx="140" cy="354" r="22" fill="#f0f0e8" stroke="#ccc" stroke-width="1.5"/>
  <text x="140" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#333">0</text>
  <circle cx="200" cy="354" r="22" fill="#fff5e0" stroke="#F5A623" stroke-width="2"/>
  <text x="200" y="359" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="800" fill="#F5A623">OK</text>

  <defs>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8f8f2"/>
      <stop offset="100%" stop-color="#e8e8e0"/>
    </linearGradient>
  </defs>
</svg>
